<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>OS AI Prototype 3.2</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f0f0;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 48px;
            height: 100vh;
            width: 100vw;
        }

        .desktop {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            overflow: auto;
            position: relative;
        }

        .desktop-icons {
            display: grid;
            grid-template-columns: repeat(auto-fill, 100px);
            gap: 20px;
            width: fit-content;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: white;
            text-align: center;
            font-size: 12px;
            transition: opacity 0.2s;
        }

        .desktop-icon:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .icon-image {
            font-size: 48px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }

        .taskbar {
            background: #2c3e50;
            border-top: 1px solid #34495e;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            overflow-x: auto;
        }

        .taskbar-item {
            background: #34495e;
            border: 1px solid #2c3e50;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .taskbar-item:hover {
            background: #3d5064;
        }

        .taskbar-item.active {
            background: #3498db;
            border-color: #2980b9;
        }

        .window {
            position: absolute;
            background: white;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            min-width: 300px;
            min-height: 200px;
            z-index: 1000;
        }

        .window.minimized {
            display: none;
        }

        .window-header {
            background: linear-gradient(90deg, #3498db, #2980b9);
            color: white;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px 6px 0 0;
            cursor: move;
            user-select: none;
        }

        .window-title {
            font-size: 13px;
            font-weight: 600;
            flex: 1;
        }

        .window-controls {
            display: flex;
            gap: 6px;
        }

        .window-btn {
            width: 20px;
            height: 20px;
            border: none;
            background: rgba(255,255,255,0.3);
            color: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .window-btn:hover {
            background: rgba(255,255,255,0.5);
        }

        .window-content {
            flex: 1;
            padding: 16px;
            overflow: auto;
            background: white;
            border-radius: 0 0 6px 6px;
        }

        .file-explorer {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .file-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .file-nav-btn {
            padding: 4px 8px;
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .file-nav-btn:hover {
            background: #d5dbdb;
        }

        .file-path {
            font-size: 11px;
            color: #7f8c8d;
            margin-bottom: 12px;
            padding: 4px 8px;
            background: #ecf0f1;
            border-radius: 3px;
            font-family: monospace;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .file-item:hover {
            background: #ecf0f1;
        }

        .file-icon {
            font-size: 16px;
            width: 20px;
        }

        .terminal {
            background: #0d1117;
            color: #58a6ff;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .terminal-input {
            display: flex;
            gap: 4px;
            padding: 8px;
            border-top: 1px solid #30363d;
        }

        .terminal-prompt {
            color: #58a6ff;
            white-space: nowrap;
        }

        .terminal-input input {
            flex: 1;
            background: transparent;
            border: none;
            color: #58a6ff;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            outline: none;
        }

        .about-dialog {
            text-align: center;
        }

        .about-dialog h2 {
            margin-top: 0;
            color: #2c3e50;
        }

        .about-dialog p {
            color: #7f8c8d;
            font-size: 13px;
            line-height: 1.6;
        }

        .notes-editor {
            display: flex;
            flex-direction: column;
        }

        .notes-editor textarea {
            flex: 1;
            border: 1px solid #bdc3c7;
            border-radius: 3px;
            padding: 8px;
            font-family: inherit;
            font-size: 12px;
            resize: none;
            outline: none;
        }

        .notes-editor button {
            margin-top: 8px;
            padding: 6px 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .notes-editor button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="desktop" id="desktop">
        <div class="desktop-icons" id="desktopIcons"></div>
    </div>
    <div class="taskbar" id="taskbar"></div>
</div>

<script>
// VM State Management
class VMDesktop {
    constructor(vmName, osType) {
        this.vmName = vmName;
        this.osType = osType;
        this.windows = [];
        this.fileSystem = this.initFileSystem();
        this.terminalHistory = [];
        this.notes = localStorage.getItem(`notes_${vmName}`) || '';
        this.init();
    }

    initFileSystem() {
        return {
            'C:\\': {
                'Users': {
                    'Admin': {
                        'Documents': {
                            'Project.txt': 'Sample project file',
                            'Notes.md': '# My Notes\n- Item 1\n- Item 2'
                        },
                        'Desktop': {}
                    }
                },
                'Program Files': {},
                'System32': {}
            }
        };
    }

    init() {
        this.renderDesktop();
        this.setupDragAndDrop();
    }

    renderDesktop() {
        const icons = [
            { name: 'File Manager', icon: '📁', app: 'fileManager' },
            { name: 'Terminal', icon: '⌨️', app: 'terminal' },
            { name: 'Text Editor', icon: '📝', app: 'notepad' },
            { name: 'System Info', icon: 'ℹ️', app: 'about' },
            { name: 'Notes', icon: '🗒️', app: 'notes' }
        ];

        const desktopIcons = document.getElementById('desktopIcons');
        desktopIcons.innerHTML = icons.map(icon => `
            <div class="desktop-icon" onclick="desktop.openApp('${icon.app}', '${icon.name}')">
                <div class="icon-image">${icon.icon}</div>
                <div>${icon.name}</div>
            </div>
        `).join('');
    }

    openApp(app, title) {
        let content = '';
        
        switch(app) {
            case 'fileManager':
                content = this.renderFileManager();
                break;
            case 'terminal':
                content = this.renderTerminal();
                break;
            case 'notepad':
                content = this.renderNotepad();
                break;
            case 'about':
                content = this.renderAbout();
                break;
            case 'notes':
                content = this.renderNotes();
                break;
        }

        this.createWindow(title, content, app);
    }

    renderFileManager() {
        const drive = 'C:\\';
        const files = ['Users', 'Program Files', 'System32'];
        
        return `
            <div class="file-explorer">
                <div class="file-nav">
                    <button class="file-nav-btn">← Back</button>
                    <button class="file-nav-btn">⟳ Refresh</button>
                </div>
                <div class="file-path">${drive}</div>
                <div class="file-list">
                    ${files.map(f => `
                        <div class="file-item">
                            <span class="file-icon">📂</span>
                            <span>${f}</span>
                        </div>
                    `).join('')}
                    <div class="file-item">
                        <span class="file-icon">📄</span>
                        <span>ReadMe.txt</span>
                    </div>
                    <div class="file-item">
                        <span class="file-icon">📄</span>
                        <span>Config.ini</span>
                    </div>
                </div>
            </div>
        `;
    }

    renderTerminal() {
        return `
            <div class="terminal">
                <div class="terminal-output" id="terminalOutput">
PS C:\\Users\\Admin> 
                </div>
                <div class="terminal-input">
                    <span class="terminal-prompt">PS C:\\Users\\Admin></span>
                    <input type="text" id="terminalInput" placeholder="Enter command..." autofocus>
                </div>
            </div>
        `;
    }

    renderNotepad() {
        return `
            <div style="display: flex; flex-direction: column; height: 100%; gap: 8px;">
                <textarea id="notepadEditor" style="flex: 1; padding: 8px; font-family: monospace; font-size: 12px; border: 1px solid #ccc; border-radius: 3px;">// Untitled Document

function helloWorld() {
    console.log("Welcome to the VM!");
}
</textarea>
                <div style="display: flex; gap: 8px;">
                    <button onclick="alert('Saved!')" style="flex: 1; padding: 6px; background: #3498db; color: white; border: none; border-radius: 3px; cursor: pointer;">Save</button>
                    <button onclick="document.getElementById('notepadEditor').value=''" style="flex: 1; padding: 6px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer;">Clear</button>
                </div>
            </div>
        `;
    }

    renderAbout() {
        return `
            <div class="about-dialog">
                <h2>${this.vmName}</h2>
                <p><strong>Operating System:</strong> ${this.osType}</p>
                <p><strong>RAM:</strong> 4 GB</p>
                <p><strong>Storage:</strong> 64 GB</p>
                <p><strong>CPU:</strong> 2 cores</p>
                <hr style="margin: 16px 0; border: none; border-top: 1px solid #bdc3c7;">
                <p><strong>OS AI Prototype 3.2</strong></p>
                <p>Simulated desktop environment for testing and development.</p>
                <p style="font-size: 11px; color: #95a5a6;">A future native build will connect this screen to a real virtualization backend.</p>
            </div>
        `;
    }

    renderNotes() {
        return `
            <div class="notes-editor">
                <textarea id="notesInput" placeholder="Write your notes here...">${this.notes}</textarea>
                <button onclick="desktop.saveNotes()">Save Notes</button>
            </div>
        `;
    }

    saveNotes() {
        this.notes = document.getElementById('notesInput').value;
        localStorage.setItem(`notes_${this.vmName}`, this.notes);
        alert('Notes saved!');
    }

    createWindow(title, content, appType) {
        const winId = `win_${Date.now()}`;
        const width = 500;
        const height = 400;
        const left = Math.random() * (window.innerWidth - width);
        const top = Math.random() * (window.innerHeight - 200);

        const windowEl = document.createElement('div');
        windowEl.className = 'window';
        windowEl.id = winId;
        windowEl.style.width = width + 'px';
        windowEl.style.height = height + 'px';
        windowEl.style.left = left + 'px';
        windowEl.style.top = top + 'px';
        windowEl.innerHTML = `
            <div class="window-header">
                <span class="window-title">${title}</span>
                <div class="window-controls">
                    <button class="window-btn" onclick="desktop.minimizeWindow('${winId}')">−</button>
                    <button class="window-btn" onclick="desktop.closeWindow('${winId}')">✕</button>
                </div>
            </div>
            <div class="window-content">${content}</div>
        `;

        document.getElementById('desktop').appendChild(windowEl);
        this.makeWindowDraggable(windowEl);
        this.windows.push({ id: winId, title, app: appType });
        this.updateTaskbar();

        // Setup terminal input if this is a terminal
        if (appType === 'terminal') {
            setTimeout(() => this.setupTerminal(), 0);
        }
    }

    setupTerminal() {
        const input = document.getElementById('terminalInput');
        if (!input) return;

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                const output = document.getElementById('terminalOutput');
                const result = this.executeCommand(cmd);
                output.textContent += input.value + '\n' + result + '\nPS C:\\Users\\Admin> ';
                output.scrollTop = output.scrollHeight;
                input.value = '';
            }
        });
    }

    executeCommand(cmd) {
        const commands = {
            'help': 'Available commands: help, dir, echo, date, clear',
            'dir': 'Volume in drive C has no label.\n Documents  Config.ini  ReadMe.txt',
            'date': new Date().toString(),
            'echo': (args) => args,
            'systeminfo': 'OS: Windows 11\nCPU: 2 cores\nRAM: 4 GB\nDisk: 64 GB',
            'clear': '(cleared)',
            '': ''
        };

        if (commands[cmd]) {
            return typeof commands[cmd] === 'function' ? commands[cmd](cmd) : commands[cmd];
        }
        return `Command not found: ${cmd}`;
    }

    makeWindowDraggable(windowEl) {
        let isDragging = false;
        let offset = { x: 0, y: 0 };

        windowEl.querySelector('.window-header').addEventListener('mousedown', (e) => {
            isDragging = true;
            offset.x = e.clientX - windowEl.offsetLeft;
            offset.y = e.clientY - windowEl.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                windowEl.style.left = (e.clientX - offset.x) + 'px';
                windowEl.style.top = (e.clientY - offset.y) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    }

    minimizeWindow(winId) {
        const win = document.getElementById(winId);
        if (win) win.classList.toggle('minimized');
        this.updateTaskbar();
    }

    closeWindow(winId) {
        const win = document.getElementById(winId);
        if (win) win.remove();
        this.windows = this.windows.filter(w => w.id !== winId);
        this.updateTaskbar();
    }

    updateTaskbar() {
        const taskbar = document.getElementById('taskbar');
        taskbar.innerHTML = this.windows.map(w => `
            <div class="taskbar-item" onclick="document.getElementById('${w.id}').classList.toggle('minimized')">
                ${w.title}
            </div>
        `).join('');
    }

    setupDragAndDrop() {
        // Could add file drag/drop functionality here
    }
}

// Initialize desktop
let desktop;
window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    const vmName = params.get('name') || 'VM Instance';
    const osType = params.get('os') || 'Windows 11';
    desktop = new VMDesktop(vmName, osType);
});
</script>

</body>
</html>
